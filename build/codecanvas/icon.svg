<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262a33"/>
      <stop offset="1" stop-color="#14161b"/>
    </linearGradient>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse" x="12" y="12">
      <circle cx="22" cy="22" r="3.2" fill="#ffffff" fill-opacity="0.09"/>
    </pattern>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <!-- macOS icon grid: an 824 px tile centered on a 1024 px canvas -->
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#background)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#dots)"/>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <!-- usage lines between the blocks -->
  <path d="M500 330 C 545 330, 515 470, 560 470" fill="none" stroke="#c4cad4" stroke-opacity="0.55" stroke-width="16" stroke-linecap="round"/>
  <path d="M560 590 C 515 590, 515 700, 470 700" fill="none" stroke="#c4cad4" stroke-opacity="0.55" stroke-width="16" stroke-linecap="round"/>
  <!-- function block (pink) -->
  <g>
    <rect x="200" y="230" width="300" height="200" rx="36" fill="#3a2333" stroke="#ec5fa5" stroke-width="10"/>
    <path d="M236 230 h228 a36 36 0 0 1 36 36 v40 h-300 v-40 a36 36 0 0 1 36 -36 z" fill="#ec5fa5"/>
    <rect x="232" y="338" width="190" height="16" rx="8" fill="#ffffff" fill-opacity="0.38"/>
    <rect x="232" y="374" width="130" height="16" rx="8" fill="#ffffff" fill-opacity="0.24"/>
  </g>
  <!-- class block (green) -->
  <g>
    <rect x="560" y="400" width="280" height="250" rx="36" fill="#1c3a2e" stroke="#34b27a" stroke-width="10"/>
    <path d="M596 400 h208 a36 36 0 0 1 36 36 v40 h-280 v-40 a36 36 0 0 1 36 -36 z" fill="#34b27a"/>
    <rect x="590" y="508" width="220" height="44" rx="14" fill="#34b27a" fill-opacity="0.35"/>
    <rect x="590" y="572" width="160" height="44" rx="14" fill="#34b27a" fill-opacity="0.35"/>
  </g>
  <!-- variable block (blue) -->
  <g>
    <rect x="210" y="620" width="260" height="170" rx="36" fill="#1f2c46" stroke="#4b8ef7" stroke-width="10"/>
    <path d="M246 620 h188 a36 36 0 0 1 36 36 v40 h-260 v-40 a36 36 0 0 1 36 -36 z" fill="#4b8ef7"/>
    <rect x="242" y="728" width="150" height="16" rx="8" fill="#ffffff" fill-opacity="0.34"/>
  </g>
</svg>
